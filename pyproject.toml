[project]
name = "jev-trade"
version = "0.1.0"
description = "A simulated high-frequency crypto trading loop driven by TypeSafe AI's Jev System One model"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
sdk = ["typesafe-sdk>=0.6.0"]
dev = ["pytest>=7.0"]
# Only the FOMC press-conference transcripts need this, and only to turn a PDF
# into text. Without it that one arm reports itself dark and nothing else changes.
pdf = ["pypdf>=4"]

[project.scripts]
jevtrade = "jevtrade.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jevtrade*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
